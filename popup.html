<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Print to Structured Layout YAML</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo-group">
        <svg class="icon-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <div>
          <h1>Layout YAML</h1>
          <p class="subtitle">AI Context Extractor</p>
        </div>
      </div>
      <span class="badge" id="page-status">Ready</span>
    </header>

    <div class="actions">
      <button id="btn-export" class="btn btn-primary">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Save YAML to File
      </button>

      <div class="btn-row">
        <button id="btn-copy" class="btn btn-secondary">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          Copy to Clipboard
        </button>
        <button id="btn-preview" class="btn btn-secondary">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          Preview
        </button>
      </div>
    </div>

    <div id="stats-panel" class="stats-panel">
      <div class="stat-item">
        <span class="stat-label">Elements</span>
        <span class="stat-value" id="stat-elements">-</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Size</span>
        <span class="stat-value" id="stat-size">-</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Est. Tokens</span>
        <span class="stat-value" id="stat-tokens">-</span>
      </div>
    </div>

    <div id="preview-container" class="preview-container hidden">
      <div class="preview-header">
        <span>YAML Output Preview</span>
        <button id="btn-close-preview" class="btn-text">✕</button>
      </div>
      <pre id="preview-code"><code></code></pre>
    </div>

    <footer class="footer">
      <p>💡 Tip: You can also right-click anywhere on the page and select <b>Print to Structured Layout YAML</b></p>
    </footer>
  </div>

  <script src="yaml.js"></script>
  <script src="extractor.js"></script>
  <script src="popup.js"></script>
</body>
</html>
